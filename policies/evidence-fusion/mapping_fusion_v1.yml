policy_id: mapping-fusion-v1
version: "1.0"
subject_kind: MAPPING
status: UNCALIBRATED
automation_enabled: false
auto_accept_enabled: false
auto_reject_enabled: false
requires_g5_for_automation: true
score_semantics: UNCALIBRATED_DECISION_SCORE
normalization:
  matcher_rank: ordinal_presence_v1
  bounded_01: identity_v1
  semantic: qualitative_only_v1
normalization_rules:
  - {rule_id: bounded-01, metric_names: [quality_ratio], method: identity_v1, version: "1"}
  - {rule_id: compatibility-01, metric_names: [type_compatibility], method: compatibility_strength_v1, version: "1"}
  - {rule_id: matcher-rank, metric_names: ["matcher_rank:coma", "matcher_rank:cupid"], method: ordinal_presence_v1, version: "1"}
  - {rule_id: qualitative-only, metric_names: [semantic_hypothesis, domain_assertion], method: qualitative_only_v1, version: "1"}
scoring_dimensions:
  - {dimension_id: "matcher:coma:rank", metric_names: ["matcher_rank:coma"], weight: 1.0, normalization_rule_id: matcher-rank, dependency_group: "matcher:coma", required: false}
  - {dimension_id: "matcher:cupid:rank", metric_names: ["matcher_rank:cupid"], weight: 1.0, normalization_rule_id: matcher-rank, dependency_group: "matcher:cupid", required: false}
  - {dimension_id: type_compatibility, metric_names: [type_compatibility], weight: 0.75, normalization_rule_id: compatibility-01, dependency_group: type_compatibility, required: true}
weights:
  matcher_rank: 1.0
  type_compatibility: 0.75
  dependency: 0.5
critical_evidence:
  required_producers: [PROFILE, QUALITY, DEPENDENCY]
  cross_source_mapping_requires_schema_matching: true
conflicts:
  - SEMANTIC_STRUCTURAL_CONFLICT
  - TYPE_SEMANTIC_CONFLICT
  - MULTIPLE_TARGET_AMBIGUITY
conflict_rules:
  - {rule_id: semantic-structural, conflict_type: SEMANTIC_STRUCTURAL_CONFLICT, semantics: "semantic support plus relevant structural contradiction", eligible_metric_names: [type_compatibility], eligible_families: [SCHEMA_MATCHING]}
  - {rule_id: type-semantic, conflict_type: TYPE_SEMANTIC_CONFLICT, semantics: "incompatible type plus semantic or matcher support", eligible_metric_names: [type_compatibility], eligible_families: [SCHEMA_MATCHING]}
  - {rule_id: multiple-target, conflict_type: MULTIPLE_TARGET_AMBIGUITY, semantics: "competing target candidate changes applicability"}
