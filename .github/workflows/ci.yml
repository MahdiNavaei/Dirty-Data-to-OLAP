name: Dirty Data to OLAP PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirty-data-to-olap-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-contracts:
    name: Lightweight PR contracts and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.11.16"
          check-latest: false
      - name: Install locked project tooling
        run: python -m pip install --disable-pip-version-check uv==0.11.26
      - name: Install locked test environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pr-checks
        run: uv sync --locked --python "$(command -v python)" --group dev --extra api --extra sql --extra files --extra profiling --extra compatibility
      - name: Run lightweight contract and architecture tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pr-checks
        run: >-
          uv run --locked --no-sync --python "$(command -v python)" --group dev
          python -m pytest
          tests/unit/test_multi_source_runtime.py
          tests/unit/test_prompt02_contracts.py
          tests/architecture/test_prompt02_architecture_equivalence.py -q
      - name: Verify PR worktree and diff formatting
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  secret-scan:
    name: Lightweight PR secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
