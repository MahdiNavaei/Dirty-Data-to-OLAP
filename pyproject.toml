[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirty-data-to-olap"
version = "0.1.0"
description = "Evidence-first database access foundations for Dirty Data to OLAP"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
