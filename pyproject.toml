[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirty-data-to-olap"
version = "0.1.0"
description = "Evidence-first database access foundations for Dirty Data to OLAP"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.12,<3",
  "duckdb>=1.0,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.30,<1",
]
matching = [
    "valentine==1.0.0",
]
entity_resolution = [
    "splink==4.0.17",
]
test = [
  "pytest>=8.4,<9",
  "PyYAML>=6.0,<7",
  "httpx2==2.12.0",
]
sql = [
  "dlt==1.30.0",
  "SQLAlchemy>=2.0,<3",
]
files = [
  "pyarrow>=16,<23",
]
profiling = [
  "DataProfiler==0.13.4",
  "setuptools<81",
]
excel = [
  "openpyxl>=3.1,<4",
]
compatibility = [
  "cryptography==44.0.2",
  "psycopg[binary]==3.2.10",
  "PyMySQL==1.1.2",
  "pyodbc==5.2.0",
]
ml = [
  "scikit-learn==1.7.2",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pip-audit==2.9.0",
  "pytest>=8.4,<9",
  "PyYAML>=6.0,<7",
]

[tool.uv]
conflicts = [
  [
    { extra = "matching" },
    { extra = "profiling" },
  ],
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "api: independent HTTP contract checks",
  "system: independent assembled-product checks",
  "historical_evidence: validates retained historical receipts or artifacts",
  "optional_provider: requires an explicitly optional provider runtime",
]
