schema_version: "1.0"
owner: "Step26 Data Visualization Engineer"
renderer_dependency: "none_required"
raw_domain_objects_to_browser: false
color_only_encoding: false
accessible_equivalent_required: true
privacy:
  raw_pii: false
  raw_values: false
  raw_sql: false
  secrets: false
graph:
  stable_visual_id_distinct_from_layout: true
  declared_vs_inferred_distinct: true
  candidate_vs_accepted_distinct: true
  cluster_is_canonical_identity: false
  lineage_direction_explicit: true
  lineage_implies_causality: false
  raw_score_is_probability: false
  probability_requires_calibration: true
  sample_is_full: false
  human_assertion_is_model_evidence: false
  no_dangling_edges: true
  er_candidate_vs_authorized_linkage_distinct: true
  er_linkage_is_not_canonical_identity: true
states:
  exact_step25_interaction_states_supported: [NO_EVIDENCE, NO_CANDIDATES, CAPABILITY_UNAVAILABLE, PROVIDER_FAILED, TIMEOUT, INCOMPLETE, PRIVACY_BLOCKED, REVIEW_REQUIRED, STALE, INVALIDATED, SUPERSEDED, TARGET_CHANGED, VALIDATION_FAILED, NOT_EVALUATED, NOT_APPLICABLE, PARTIAL_SUCCESS, LONG_RUNNING]
  failure_can_be_pass: false
  not_evaluated_can_be_hidden: false
  privacy_blocked_is_explicit: true
  stale_and_invalidated_are_preserved: true
quality:
  denominator_required_for_measured_cells: true
  observation_scope_required: true
profile:
  histogram_requires_ordered_numeric_buckets: true
  privacy_blocked_points_transferred: false
analytical:
  grain_explicit: true
  non_additive_default_sum: false
  authoritative_measure_source: reviewed_measure_spec_and_analytical_plan
validation:
  authoritative_source: complete_hash_bound_validation_report
  exploratory_subset_can_claim_global_pass: false
filters:
  active_filter_disclosure_derived_from_selectors: true
accessibility:
  exact_rendered_node_row_closure: true
