schema_version: 1
scope: v1_software_component_boundaries
provenance: Specialist Step 04 Software / Solution Architect
namespace:
  python_import: dirty_data_to_olap
  proposed_package_root: src/dirty_data_to_olap/
  implementation_created_in_step04: false
components:
  - component_id: domain.contracts
    name: Project-owned domain contracts
    layer: domain/contracts
    ownership: Dirty Data to OLAP
    responsibilities: [stable IDs, provenance, evidence, decisions, canonical and analytical contract shapes]
    input_contracts: [none]
    output_contracts: [project-owned contracts]
    depends_on: []
    implementation_owner: Step06 Database Engineer / DBA
    implementation_step: 6
    implementation_status: IMPLEMENTED
    ownership_scope: bootstrap-only; semantic contract families remain separately owned
    side_effect_class: none
    persistence_access: none
    optional: false
    failure_behavior: invalid contract is rejected before execution
  - component_id: application.run_manager
    name: Run Manager
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [create run, pin configuration, request resume, manage RunStatus]
    input_contracts: [RunRequest, ResumeRequest]
    output_contracts: [RunManifest, RunStatus]
    depends_on: [application.stage_orchestrator, domain.contracts]
    ports_used: [ControlStorePort, CapabilityRegistryPort]
    implementation_owner: Step27 Backend Engineer
    implementation_step: 27
    implementation_status: PLANNED
    side_effect_class: control_metadata
    persistence_access: ControlStorePort
    optional: false
    failure_behavior: explicit FAILED or BLOCKED state with retained evidence
  - component_id: application.stage_orchestrator
    name: Stage Orchestrator
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [resolve DAG, create attempts, checkpoint cancellation, coordinate stages]
    input_contracts: [RunManifest, StageGraph]
    output_contracts: [StageAttempt, RunTransition]
    depends_on: [domain.contracts]
    ports_used: [StageExecutorPort, ControlStorePort, ArtifactStorePort, CapabilityRegistryPort]
    implementation_owner: Step28 Distributed Systems / Jobs Engineer
    implementation_step: 28
    implementation_status: PLANNED
    side_effect_class: control_metadata
    persistence_access: ControlStorePort and ArtifactStorePort through ports
    optional: false
    failure_behavior: preserve attempt evidence and apply lifecycle transition rules
  - component_id: application.review_policy
    name: Review and Policy Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [present and record stage-scoped review requests, bind decisions to exact subject artifacts, validate replay compatibility, invalidate incompatible decisions, expose unresolved checkpoint state, retain review history]
    input_contracts: [ReviewCheckpointRequest, ReviewDecision, CompatibilityContext]
    output_contracts: [ReviewDecision, ReviewCheckpointStatus, ReviewStatus]
    depends_on: [domain.contracts]
    ports_used: [ControlStorePort, ArtifactStorePort]
    implementation_owner: Step27 Backend Engineer
    implementation_step: 27
    implementation_status: PLANNED
    side_effect_class: control_metadata
    persistence_access: ControlStorePort and ArtifactStorePort through ports
    optional: false
    failure_behavior: incompatible replay becomes NEEDS_REVIEW
  - component_id: application.source_registry
    name: Source Registry
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [source metadata, inclusion rules, sampling policy, read-only profile references]
    input_contracts: [SourceDescriptor, SourceSelection]
    output_contracts: [SourceRegistryRecord]
    depends_on: [domain.contracts]
    ports_used: [ControlStorePort]
    implementation_owner: Step07 Senior Data Engineer
    implementation_step: 7
    implementation_status: PLANNED
    side_effect_class: control_metadata
    persistence_access: ControlStorePort
    optional: false
    failure_behavior: invalid or unsafe source profile is rejected
  - component_id: application.source_snapshot
    name: Source Snapshot Coordinator
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [bounded snapshot coordination, immutable source references, staging requests]
    input_contracts: [SourceCatalog, SamplingPolicy]
    output_contracts: [SourceSnapshot, BatchReference, SourceRecordReference]
    depends_on: [application.discovery, application.source_registry, domain.contracts]
    ports_used: [SourceAdapter, ArtifactStorePort, ControlStorePort]
    implementation_owner: Step07 Senior Data Engineer
    implementation_step: 7
    implementation_status: PLANNED
    side_effect_class: read_only_source_and_artifact
    persistence_access: ArtifactStorePort and ControlStorePort through ports
    optional: false
    failure_behavior: access failure BLOCKED; extraction failure FAILED
  - component_id: application.discovery
    name: Source Discovery Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [catalog tables, columns, types and declared constraints]
    input_contracts: [SourceSelection, SourceRegistryRecord]
    output_contracts: [SourceCatalog]
    depends_on: [application.source_registry, domain.contracts]
    ports_used: [SourceAdapter, ArtifactStorePort]
    implementation_owner: Step07 Senior Data Engineer
    implementation_step: 7
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: stage FAILED without guessed catalog
  - component_id: application.profiling
    name: Profiling Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [profile columns and tables with observation scope]
    input_contracts: [SourceCatalog, SourceSnapshot]
    output_contracts: [ColumnProfile, TableProfile]
    depends_on: [application.discovery, domain.contracts]
    ports_used: [ProfilingAdapter, ArtifactStorePort]
    implementation_owner: Step08 Data Profiling Specialist
    implementation_step: 8
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: item failures preserved; stage NEEDS_REVIEW or FAILED
  - component_id: application.dependency_discovery
    name: Dependency Discovery Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [bounded candidate keys, FDs, AFDs, INDs, approximate INDs, search statistics and relationship hypotheses]
    input_contracts: [SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, DependencyRequest, DependencyPrivacyContext, DependencyAuthorization]
    optional_input_contracts: [ColumnProfile, TableProfile]
    output_contracts: [UniqueColumnCombinationEvidence, KeyCandidate, FunctionalDependencyEvidence, InclusionDependencyEvidence, DependencyMetricObservation, RelationshipCandidate, DependencyFailure, DependencyCapability, DependencySearchStats, DependencyArtifactReference]
    depends_on: [application.discovery, domain.contracts]
    ports_used: [DependencyDiscoveryAdapter, ArtifactStorePort]
    implementation_owner: Step12 Dependency Discovery Engineer
    implementation_step: 12
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: FAILED or NEEDS_REVIEW; never emits confirmed FK by default
  - component_id: application.schema_matching
    name: Schema Matching Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [generate bounded ranked cross-source mapping candidates, preserve explainable signal families and matcher coverage]
    input_contracts: [SourceCatalogs, SourceSnapshotResults, BatchReference, ColumnProfile, TableProfile, DependencyEvidence, SchemaMatchRequest, MatchingAuthorization]
    optional_input_contracts: [ColumnProfile, TableProfile, DependencyEvidence, MatchingAuthorization when INSTANCE_AWARE]
    output_contracts: [SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, SchemaMatchFailure, SchemaMatchCapability, SchemaMatchPruningSummary, SchemaMatchArtifactReference]
    depends_on: [application.discovery, application.source_snapshot, application.profiling, application.privacy_policy, domain.contracts]
    ports_used: [SchemaMatchingAdapter, ArtifactStorePort]
    implementation_owner: Step13 Schema Matching Engineer
    implementation_step: 13
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: explicit failure or conditional SKIPPED; no canonical mutation
  - component_id: application.quality
    name: Quality Analysis Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [classify observations, issues, repair proposals and quarantine requirements]
    input_contracts: [SourceCatalog, SourceSnapshot, SourceSnapshotResult, BatchReference, SourceRecordReference, ColumnProfile, TableProfile, ValuePatternSummary, DependencyEvidence, QualityRule]
    optional_input_contracts: [DependencyEvidence]
    output_contracts: [QualityIssue, RepairProposal, RepairValidationPlan, QualityResult]
    depends_on: [application.discovery, application.profiling, domain.contracts]
    ports_used: [QualityStagedReader, ArtifactStorePort]
    implementation_owner: Step09 Data Quality Engineer
    implementation_step: 9
    implementation_status: PLANNED
    side_effect_class: staged_read_and_artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: preserve issue evidence; staged integrity and unresolved semantics are explicit; no source writes
  - component_id: application.privacy_policy
    name: Privacy Policy Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [classify sensitive data, minimize values, guard exposure contexts, sanitize logs, manage privacy-owned ephemeral retention]
    input_contracts: [PrivacyPolicy, PrivacyRule, PrivacyClassification, ArtifactSensitivity, ExposureRequest]
    output_contracts: [PrivacyClassification, PrivacyDecision, ExternalProcessingDecision, PrivacyFailure, PrivacyScanResult, PrivacyManifest]
    depends_on: [domain.contracts]
    ports_used: []
    implementation_owner: Step10 Data Security / Privacy Engineer
    implementation_step: 10
    implementation_status: IMPLEMENTED
    side_effect_class: policy_and_privacy_owned_cleanup
    persistence_access: none; callers own artifact persistence through ArtifactStorePort
    optional: false
    failure_behavior: unknown and sensitive exposure is blocked or masked; key/path failures fail closed
  - component_id: application.database_security
    name: Source Database Security Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [credential-purpose isolation, source security assurance, privilege policy, query classification, safe database audit events]
    input_contracts: [ConnectionProfileReference, DatabaseSecurityPolicy, CredentialPurpose]
    output_contracts: [DatabaseSecurityAssessment, DatabaseSecurityAssurance, QueryGuardDecision, DatabaseSecurityAuditEvent, DatabaseSecurityFailure]
    depends_on: [domain.contracts]
    ports_used: []
    implementation_owner: Step11 Database Security Specialist
    implementation_step: 11
    implementation_status: IMPLEMENTED
    side_effect_class: policy_and_security_evidence
    persistence_access: none; only safe references and fingerprints may be persisted
    optional: false
    failure_behavior: unverified provider, wrong credential purpose, unsafe privilege and unknown query fail closed
  - component_id: application.semantic_evidence
    name: Optional Semantic Evidence Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [request bounded semantic suggestions and preserve provenance]
    input_contracts: [SemanticEvidenceRequest]
    output_contracts: [LLMEvidence]
    depends_on: [domain.contracts]
    ports_used: [OptionalSemanticEvidenceAdapter, ArtifactStorePort]
    implementation_owner: Step16 LLM / Semantic AI Engineer
    implementation_step: 16
    implementation_status: IMPLEMENTED
    side_effect_class: external_optional_and_artifact
    persistence_access: ArtifactStorePort
    optional: true
    failure_behavior: SKIPPED when optional and unavailable; BLOCKED when required
  - component_id: application.evidence_fusion
    name: Evidence Fusion Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [combine evidence, preserve conflicts, emit decisions and hypotheses]
    input_contracts: ["ProfileResult[]", "QualityResult[]", "DependencyResult[]", "SchemaMatchResult[] when cross_source_mapping_scope", DeclaredConstraint, SourceCatalog, DomainAssertion, "LLMEvidence[]", "AppliedMLResult[]", FusionSubjectBinding, ProducerEvidenceStatus]
    output_contracts: [EvidenceFusionResult, RelationshipDecision, SemanticMappingDecision, RepairProposal, Conflict]
    depends_on: [application.profiling, application.dependency_discovery, application.quality, domain.contracts]
    conditional_dependencies:
      - dependency: application.schema_matching
        when: cross_source_mapping_scope == true
        requires: complete SchemaMatchCandidate artifact
        otherwise: absent or policy-recorded SKIPPED matching is allowed
    ports_used: [ArtifactStorePort, ControlStorePort]
    implementation_owner: Step17 Evidence Fusion Engineer
    implementation_step: 17
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort and ControlStorePort through ports
    optional: false
    failure_behavior: conflict remains REVIEW_REQUIRED; missing or stale evidence is explicit; no score-as-truth
  - component_id: application.canonical_hypotheses
    name: Canonical Hypothesis Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [entity type hypotheses, attributes, identity candidates, ER specifications, post-ER identity proposal preparation]
    input_contracts: [RelationshipDecision, SemanticMappingDecision, RepairProposal, ReviewDecision from REVIEW_EVIDENCE_DECISIONS, DomainAssertion]
    output_contracts: [CanonicalModelHypothesis, CanonicalIdentityProposal, EntityResolutionSpec]
    depends_on: [application.evidence_fusion, application.review_policy, domain.contracts]
    ports_used: [ArtifactStorePort]
    implementation_owner: Step19 Canonical Model Engineer
    implementation_step: 19
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: unresolved identity remains REVIEW_REQUIRED
  - component_id: application.entity_resolution
    name: Entity Resolution Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [run selected entity-family linkage and retain linkage evidence without assigning canonical identity]
    input_contracts: [EntityResolutionSpec, SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, IdentityFieldSpecification, EntityResolutionAuthorization, EvidenceReferences]
    output_contracts: [EntityMatchEdge, EntityCluster, EntityClusterDiagnostic, EntityResolutionResult, EntityResolutionFailure, EntityResolutionCapability, EntityResolutionArtifactReference]
    depends_on: [application.canonical_hypotheses, domain.contracts]
    ports_used: [EntityResolutionAdapter, ArtifactStorePort]
    implementation_owner: Step14 Entity Resolution Engineer
    implementation_step: 14
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: true
    capability_required_for_v1: false
    runtime_stage_conditional: true
    failure_behavior: affected family FAILED or NEEDS_REVIEW; no source deletion
  - component_id: application.learned_evidence
    name: Optional Applied ML Learned Evidence Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [build leakage-safe aggregate features, evaluate deterministic baselines, train optional transparent rankers, emit candidate ranking evidence and review suggestions]
    input_contracts: [RelationshipCandidate, InclusionDependencyEvidence, SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, ColumnProfile, QualityResult]
    optional_training_inputs: [MLTrainingLabel, benchmark dataset configuration]
    output_contracts: [MLFeatureVector, MLBaselineEvaluation, MLModelEvidence, LearnedRankingEvidence, MLFeatureContribution, MLRankStabilityObservation, ActiveLearningSuggestion, MLCalibrationExperiment]
    depends_on: [application.dependency_discovery, application.schema_matching, application.profiling, application.quality, domain.contracts]
    ports_used: [LearnedEvidenceAdapter, ArtifactStorePort]
    implementation_owner: Step15 Applied ML Engineer
    implementation_step: 15
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: true
    capability_required_for_v1: false
    runtime_stage_conditional: true
    failure_behavior: retain deterministic baseline; explicit UNAVAILABLE, INSUFFICIENT_DATA or FAILED; never emits acceptance
  - component_id: application.canonical_finalization
    name: Canonical Finalization Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [accepted canonical instances, mappings, survivorship and conflicts]
    input_contracts: [CanonicalModelHypothesis, CanonicalIdentityProposal, EntityResolutionResult, ReviewDecision]
    output_contracts: [CanonicalModel, SourceRecordCanonicalMap, CanonicalAttribute, CanonicalIdentityMembership]
    depends_on: [application.canonical_hypotheses, application.review_policy, domain.contracts]
    conditional_dependencies:
      - dependency: application.entity_resolution
        scope: entity_family
        when: entity_resolution_required(entity_family) == true
        requires: [complete EntityResolutionResult compatible with the hypothesis spec, proposal-owned membership edges, post-ER REVIEW_CANONICAL_IDENTITY checkpoint, accepted_or_review_acceptable identity decision bound to that proposal]
        on_failure: family_scoped BLOCKED or NEEDS_REVIEW; no SourceRecordCanonicalMap is published
      - dependency: application.entity_resolution
        scope: entity_family
        when: entity_resolution_required(entity_family) == false
        requires: ER may be absent or policy-recorded SKIPPED
        on_success: finalization may proceed when all other guards hold
    ports_used: [ArtifactStorePort, ControlStorePort]
    implementation_owner: Step19 Canonical Model Engineer
    implementation_step: 19
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort and ControlStorePort through ports
    optional: false
    failure_behavior: unresolved or conflicted identity remains NEEDS_REVIEW
  - component_id: application.analytical_planner
    name: Analytical Planner
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [facts, dimensions, grain, measures, keys and mappings]
    input_contracts: [CanonicalModel, RelationshipDecision, DomainAssertion]
    output_contracts: [AnalyticalPlan, FactSpec, DimensionSpec, GrainSpec, MeasureSpec]
    depends_on: [application.canonical_finalization, domain.contracts]
    ports_used: [ArtifactStorePort]
    implementation_owner: Step20 OLAP Engineer
    implementation_step: 20
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: ambiguous grain or semantics becomes NEEDS_REVIEW
  - component_id: application.compiler
    name: Compiler
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [compile approved analytical plan into execution artifacts]
    input_contracts: [AnalyticalPlan, ReviewDecision from REVIEW_ANALYTICAL_PLAN]
    output_contracts: [CompiledPlan, GeneratedSQL]
    depends_on: [application.analytical_planner, application.review_policy, domain.contracts]
    ports_used: [ArtifactStorePort]
    implementation_owner: Step20 OLAP Engineer
    implementation_step: 20
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: unresolved or incompatible analytical-plan review is NEEDS_REVIEW; compilation failure is FAILED; no execution occurs
  - component_id: application.materializer
    name: Materializer Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [execute approved compiled plan into controlled target]
    input_contracts: [CompiledPlan, ReviewDecision from REVIEW_MATERIALIZATION_PLAN]
    output_contracts: [MaterializationArtifact]
    depends_on: [application.compiler, application.review_policy, domain.contracts]
    ports_used: [MaterializerPort, ArtifactStorePort]
    implementation_owner: Step20 OLAP Engineer
    implementation_step: 20
    implementation_status: PLANNED
    side_effect_class: controlled_target_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: unresolved or incompatible materialization approval is NEEDS_REVIEW; incomplete target is non-consumable and stage FAILED
  - component_id: application.validation
    name: Validation and Reconciliation Service
    layer: application
    ownership: Dirty Data to OLAP
    responsibilities: [validate target, grain, relationships, measures and record accounting]
    input_contracts: [AnalyticalPlan, MaterializationArtifact, RecordAccounting, Lineage]
    output_contracts: [ValidationReport, ReconciliationResult]
    depends_on: [application.materializer, application.analytical_planner, domain.contracts]
    ports_used: [ArtifactStorePort, ControlStorePort]
    implementation_owner: Step22 Data QA Engineer
    implementation_step: 22
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort and ControlStorePort through ports
    optional: false
    failure_behavior: failed validation makes run FAILED and target non-accepted
  - component_id: adapters.source
    name: Source Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize SQL/file source behavior]
    input_contracts: [SourceSelection, SourceRegistryRecord, SourceCatalog, SamplingPolicy, ConnectionProfileReference]
    output_contracts: [SourceDescriptor, TableDescriptor, ColumnDescriptor, DeclaredConstraint, SourceSnapshot, BatchReference, SourceRecordReference]
    depends_on: [domain.contracts]
    extension_port: SourceAdapter
    implementation_owner: Step07 Senior Data Engineer
    implementation_step: 7
    implementation_status: PLANNED
    side_effect_class: read_only_source
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: explicit access/extraction failure
  - component_id: adapters.database_security
    name: Database Security Enforcement Adapter
    layer: adapters
    ownership: adapter implementation
    responsibilities: [apply SQLite and SQLAlchemy connection controls, verify required initialization, prevent unsafe source operations]
    input_contracts: [DatabaseSecurityAssurance, ConnectionProfileReference]
    output_contracts: [DatabaseSecurityFailure, DatabaseSecurityAuditEvent]
    depends_on: [application.database_security, domain.contracts]
    ports_used: []
    implementation_owner: Step11 Database Security Specialist
    implementation_step: 11
    implementation_status: IMPLEMENTED
    side_effect_class: read_only_source_control
    persistence_access: none
    optional: false
    failure_behavior: hook or authorizer setup failure blocks the source before dlt
  - component_id: adapters.profiling
    name: Profiling Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize profiler output]
    input_contracts: [ProfileRequest]
    output_contracts: [ColumnProfile, TableProfile]
    depends_on: [domain.contracts]
    extension_port: ProfilingAdapter
    implementation_owner: Step08 Data Profiling Specialist
    implementation_step: 8
    implementation_status: PLANNED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: explicit item/stage failure
  - component_id: adapters.quality
    name: Staged Quality Reader Adapter
    layer: adapters
    ownership: adapter implementation
    responsibilities: [read integrity-checked staged batches for quality analysis]
    input_contracts: [SourceSnapshotResult, BatchReference, SourceRecordReference]
    output_contracts: [QualityStagedRow]
    depends_on: [domain.contracts]
    extension_port: QualityStagedReader
    implementation_owner: Step09 Data Quality Engineer
    implementation_step: 9
    implementation_status: PLANNED
    side_effect_class: read_staged_artifacts
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: explicit input-integrity failure; no source access
  - component_id: adapters.dependencies
    name: Dependency Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [read complete staged rows, require policy-issued authorization, apply bounded search policy, normalize native or local Docker Desbordante evidence and publish aggregate artifacts]
    input_contracts: [SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, DependencyRequest, DependencyPrivacyContext, DependencyAuthorization]
    optional_input_contracts: [ColumnProfile, TableProfile]
    output_contracts: [UniqueColumnCombinationEvidence, KeyCandidate, FunctionalDependencyEvidence, InclusionDependencyEvidence, DependencyMetricObservation, RelationshipCandidate, DependencyFailure, DependencyCapability, DependencySearchStats, DependencyArtifactReference]
    depends_on: [domain.contracts]
    extension_port: DependencyDiscoveryAdapter
    implementation_owner: Step12 Dependency Discovery Engineer
    implementation_step: 12
    implementation_status: IMPLEMENTED
    capability_required_for_v1: true
    runtime_stage_conditional: false
    side_effect_class: staged_read_and_project_local_ephemeral_input
    persistence_access: ArtifactStorePort
    optional: false
    failure_behavior: explicit capability/input/engine failure; no synthetic fallback
  - component_id: adapters.matching
    name: Schema Matching Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [read complete hash-bound staged snapshots, execute official Valentine, normalize raw scores and signal provenance]
    input_contracts: [SourceCatalogs, SourceSnapshotResults, BatchReference, ColumnProfile, TableProfile, DependencyEvidence, SchemaMatchRequest]
    optional_input_contracts: [DependencyEvidence, MatchingAuthorization when INSTANCE_AWARE]
    output_contracts: [SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, SchemaMatchFailure, SchemaMatchCapability, SchemaMatchPruningSummary]
    depends_on: [domain.contracts]
    extension_port: SchemaMatchingAdapter
    implementation_owner: Step13 Schema Matching Engineer
    implementation_step: 13
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: false
    capability_required_for_v1: true
    runtime_stage_conditional: true
    failure_behavior: explicit failure or optional absence
  - component_id: adapters.entity_resolution
    name: Entity Resolution Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize linkage output]
    input_contracts: [EntityResolutionSpec, SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, IdentityFieldSpecification, EntityResolutionAuthorization, EvidenceReferences]
    output_contracts: [EntityMatchEdge, EntityCluster, EntityClusterDiagnostic, EntityResolutionResult, EntityResolutionFailure, EntityResolutionCapability, EntityResolutionArtifactReference]
    depends_on: [domain.contracts]
    extension_port: EntityResolutionAdapter
    implementation_owner: Step14 Entity Resolution Engineer
    implementation_step: 14
    implementation_status: IMPLEMENTED
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: true
    capability_required_for_v1: false
    runtime_stage_conditional: true
    failure_behavior: affected family failure
  - component_id: adapters.ml
    name: Applied ML Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize optional sklearn model output, persist transparent JSON coefficients, expose capability and unavailable paths]
    input_contracts: [MLFeatureSchema, MLDatasetRow, MLSplitManifest, MLDatasetManifest]
    output_contracts: [MLModelEvidence, LearnedRankingEvidence, MLFeatureContribution]
    depends_on: [domain.contracts]
    extension_port: LearnedEvidenceAdapter
    implementation_owner: Step15 Applied ML Engineer
    implementation_step: 15
    implementation_status: IMPLEMENTED
    capability_required_for_v1: false
    runtime_stage_conditional: true
    side_effect_class: artifact_write
    persistence_access: ArtifactStorePort
    optional: true
    failure_behavior: unavailable or failed capability is explicit; no silent fallback beyond deterministic baseline
  - component_id: adapters.semantic
    name: Semantic Evidence Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize optional provider evidence]
    input_contracts: [SemanticEvidenceRequest]
    output_contracts: [LLMEvidence]
    depends_on: [domain.contracts]
    extension_port: OptionalSemanticEvidenceAdapter
    implementation_owner: Step16 LLM / Semantic AI Engineer
    implementation_step: 16
    implementation_status: IMPLEMENTED
    capability_required_for_v1: false
    runtime_stage_conditional: true
    side_effect_class: optional_external
    persistence_access: ArtifactStorePort
    optional: true
    failure_behavior: SKIPPED or BLOCKED according to plan
  - component_id: adapters.materialization
    name: Materialization Adapter Family
    layer: adapters
    ownership: adapter implementation
    responsibilities: [normalize target-engine execution]
    input_contracts: [CompiledPlan]
    output_contracts: [MaterializationArtifact]
