schema_version: 1
scope: v1_project_owned_engine_and_repository_ports
provenance: Specialist Step 04 Software / Solution Architect
interfaces:
  - interface_id: SourceAdapter
    purpose: Read-only source discovery and bounded snapshot extraction.
    input_contracts: [SourceSelection, SourceRegistryRecord, SourceCatalog, SamplingPolicy, ConnectionProfileReference]
    output_contracts: [SourceDescriptor, TableDescriptor, ColumnDescriptor, DeclaredConstraint, SourceCatalog, SourceSnapshot, BatchReference, SourceRecordReference]
    operations:
      - operation_id: discover_source
        inputs: [SourceSelection, SourceRegistryRecord, ConnectionProfileReference]
        outputs: [SourceDescriptor, TableDescriptor, ColumnDescriptor, DeclaredConstraint]
        application_assembler: application.discovery
        source_write: false
      - operation_id: create_bounded_snapshot
        inputs: [SourceCatalog, SamplingPolicy, ConnectionProfileReference]
        outputs: [SourceSnapshot, BatchReference, SourceRecordReference]
        application_assembler: application.source_snapshot
        source_write: false
    side_effects: [read_source, write_attempt_artifacts]
    idempotency: pinned source/configuration produces stable snapshot identity or explicit changed-snapshot result
    optional: false
    capability_id: source.adapter
    failure_mode: access failure BLOCKED; extraction failure FAILED
    adapter_component: adapters.source
    forbidden_behavior: [source writes, native dlt objects in project contracts]
  - interface_id: ProfilingAdapter
    purpose: Scoped column and table observations.
    input_contracts: [SourceSnapshot, ProfileRequest]
    output_contracts: [ColumnProfile, TableProfile, ValuePatternSummary]
    side_effects: [write_artifacts]
    idempotency: pinned inputs/configuration/adapter version
    optional: false
    capability_id: profiling.adapter
    failure_mode: item failure retained; stage NEEDS_REVIEW or FAILED
    adapter_component: adapters.profiling
    forbidden_behavior: [native DataProfiler objects, business truth decisions]
  - interface_id: QualityStagedReader
    purpose: Stream integrity-checked staged rows for explicit quality rules.
    input_contracts: [SourceCatalog, SourceSnapshotResult, TableDescriptor, BatchReference, SourceRecordReference]
    output_contracts: [QualityStagedRow]
    streaming: bounded_iterator
    side_effects: [read_staged_artifacts]
    idempotency: pinned snapshot, batch hashes and projection
    optional: false
    capability_id: quality.staged_reader
    failure_mode: input integrity failure; no clean result
    adapter_component: adapters.quality
    forbidden_behavior: [source reconnect, source writes, raw-value artifact persistence]
  - interface_id: DependencyDiscoveryAdapter
    purpose: Bounded UCC, FD, AFD, IND and approximate-IND evidence generation over immutable staged rows.
    input_contracts: [SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, Profiles, DependencyRequest, DependencyPrivacyContext, DependencyAuthorization]
    output_contracts: [UniqueColumnCombinationEvidence, KeyCandidate, FunctionalDependencyEvidence, InclusionDependencyEvidence, DependencyMetricObservation, RelationshipCandidate, DependencyFailure, DependencyCapability, DependencySearchStats, DependencyArtifactReference]
    side_effects: [read_staged_artifacts, write_artifacts, project_local_ephemeral_engine_input, local_provider_process]
    idempotency: pinned inputs/configuration/adapter version
    optional: false
    capability_required_for_v1: true
    runtime_stage_conditional: false
    capability_id: dependencies.adapter
    failure_mode: capability/input/engine failure is recorded; incomplete output is non-consumable and no guessed relationship is emitted
    adapter_component: adapters.dependencies
    forbidden_behavior: [source reconnect, source writes, native Desbordante objects in project contracts, raw values in artifacts/logs, unbounded combinations, confirmed FK without project decision, authorization from context alone, silent provider null coercion]
  - interface_id: SchemaMatchingAdapter
    purpose: Bounded, explainable ranked cross-source mapping candidates over pinned snapshots.
    input_contracts: [SourceCatalogs, SourceSnapshotResults, BatchReference, Profiles, SchemaMatchRequest]
    optional_input_contracts: [DependencyEvidence, MatchingAuthorization when INSTANCE_AWARE]
    output_contracts: [SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, SchemaMatchFailure, SchemaMatchCapability, SchemaMatchPruningSummary, SchemaMatchArtifactReference]
    side_effects: [read_complete_hash_bound_staged_artifacts, write_artifacts, local_instance_sampling]
    idempotency: pinned source/snapshot hashes, request configuration and adapter version
    optional: false
    capability_required_for_v1: true
    runtime_stage_conditional: true
    capability_id: matching.adapter
    failure_mode: explicit failure or conditional SKIPPED; multi-source selection with no successful matcher is not COMPLETE
    adapter_component: adapters.matching
    forbidden_behavior: [native Valentine objects in project contracts, score-as-probability, raw values in artifacts/logs, source reconnect, canonical mutation, unbounded pairs]
  - interface_id: EntityResolutionAdapter
    purpose: Selected entity-family linkage.
    input_contracts: [EntityResolutionSpec, SourceRecordReference, IdentityFieldSpecification, EvidenceReferences]
    output_contracts: [EntityMatchEdge, EntityCluster]
    side_effects: [write_artifacts]
    idempotency: pinned inputs/configuration/adapter version
    optional: true
    capability_required_for_v1: false
    runtime_stage_conditional: true
    capability_id: entity_resolution.adapter
    failure_mode: affected family FAILED or NEEDS_REVIEW
    adapter_component: adapters.entity_resolution
    forbidden_behavior: [native Splink objects, source deletion, canonical_entity_id assignment, SourceRecordCanonicalMap output, fake linkage fallback]
  - interface_id: OptionalSemanticEvidenceAdapter
    purpose: Bounded semantic evidence.
    input_contracts: [SemanticEvidenceRequest, EvidenceReferences]
    output_contracts: [LLMEvidence]
    side_effects: [optional_provider_call, write_artifacts]
    idempotency: provider repeatability recorded, not assumed
    optional: true
    capability_required_for_v1: false
    runtime_stage_conditional: true
    capability_id: semantic.optional
    failure_mode: optional SKIPPED; required BLOCKED
    adapter_component: adapters.semantic
    forbidden_behavior: [sole authority, native provider object, silent fallback]
  - interface_id: MaterializerPort
    purpose: Execute an approved compiled plan into a controlled target.
    input_contracts: [CompiledPlan, ApprovedPlanReference]
    output_contracts: [MaterializationArtifact, ExecutionEvidence]
    side_effects: [write_controlled_target, write_artifacts]
    idempotency: attempt-scoped target and atomic publication
    optional: false
    capability_id: target.materializer
    failure_mode: incomplete target non-consumable; stage FAILED
    adapter_component: adapters.materialization
    forbidden_behavior: [source writes, grain redefinition, measure redefinition]
  - interface_id: ControlStorePort
    purpose: Transactional control metadata and lifecycle repository.
    input_contracts: [RunMetadata, StageAttempt, ArtifactMetadata, ReviewDecision, ReviewCheckpointStatus, ValidationStatus]
    output_contracts: [ControlMetadata, StateTransitionResult]
    side_effects: [write_control_metadata]
    idempotency: compare-and-record transitions
    optional: false
    capability_id: persistence.control_store
    failure_mode: explicit persistence failure
    adapter_component: persistence.control_store
    forbidden_behavior: [raw large row storage, opaque third-party objects, direct entrypoint mutation of review decisions]
  - interface_id: ArtifactStorePort
    purpose: Artifact-plane allocation, publication, verification and invalidation.
    input_contracts: [ArtifactEnvelope, ArtifactPayload]
    output_contracts: [ArtifactReference, ArtifactMetadata]
    side_effects: [write_artifacts]
    idempotency: content-hash/identity keyed atomic publication
    optional: false
    capability_id: persistence.artifact_store
    failure_mode: non-consumable artifact and retained failure
    adapter_component: persistence.artifact_store
    forbidden_behavior: [incomplete consumption, uncontrolled path access]
  - interface_id: StageExecutorPort
    purpose: Execute heavy stages locally or behind a future worker boundary.
    input_contracts: [StageRequest, AttemptContext, CancellationRequest]
    output_contracts: [StageAttemptResult, ArtifactReference]
    side_effects: [controlled_execution]
    idempotency: never overwrites a prior attempt
    optional: false
    capability_id: runtime.stage_executor
    failure_mode: explicit item/stage/run lifecycle outcome
    adapter_component: runtime.stage_executor
    forbidden_behavior: [implicit retry, global mutable state, queue implementation required in V1]
  - interface_id: CapabilityRegistryPort
    purpose: Detect capability availability and compatibility.
    input_contracts: [CapabilityQuery]
    output_contracts: [CapabilityRecord]
    side_effects: [read_runtime_metadata]
    idempotency: deterministic for pinned environment
    optional: false
    capability_id: runtime.capability_registry
    failure_mode: unavailable record; no import-time crash
    adapter_component: runtime.capability_registry
    forbidden_behavior: [fake capability output, silent provider substitution]
