schema_version: 1
scope: v1_runtime_stage_dag
provenance: Specialist Step 04 Software / Solution Architect
acyclic: true
stages:
  - stage_id: SOURCE_DISCOVERY
    required: true
    dependencies: []
    optional_dependencies: []
    input_artifact_types: [SourceSelection]
    output_artifact_types: [SourceCatalog]
    failure_consequence: run BLOCKED or FAILED according to access/extraction cause
    cacheable: true
    idempotency: pinned source/configuration
    review_boundary: source inclusion/exclusion
  - stage_id: SOURCE_SNAPSHOT_STAGE
    required: true
    dependencies: [SOURCE_DISCOVERY]
    optional_dependencies: []
    input_artifact_types: [SourceCatalog, SamplingPolicy]
    output_artifact_types: [SourceSnapshot, BatchReference, SourceRecordReference]
    failure_consequence: run BLOCKED or FAILED
    cacheable: true
    idempotency: immutable snapshot identity
    review_boundary: source scope and sampling policy
  - stage_id: PROFILING
    required: true
    dependencies: [SOURCE_SNAPSHOT_STAGE]
    optional_dependencies: []
    input_artifact_types: [SourceSnapshot, BatchReference]
    output_artifact_types: [ColumnProfile, TableProfile]
    failure_consequence: NEEDS_REVIEW or FAILED
    cacheable: true
    idempotency: pinned scope/configuration/adapter
    review_boundary: observation scope
  - stage_id: DEPENDENCY_DISCOVERY
    required: true
    capability_required_for_v1: true
    conditional: false
    dependencies: [SOURCE_SNAPSHOT_STAGE]
    optional_dependencies: [PROFILING]
    input_artifact_types: [SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, DependencyRequest, DependencyPrivacyContext, DependencyAuthorization]
    optional_input_artifact_types: [ColumnProfile, TableProfile]
    output_artifact_types: [UniqueColumnCombinationEvidence, KeyCandidate, FunctionalDependencyEvidence, InclusionDependencyEvidence, DependencyMetricObservation, RelationshipCandidate, DependencyFailure, DependencyCapability, DependencySearchStats, DependencyArtifactReference]
    failure_consequence: FAILED or INCOMPLETE; no guessed relationships and no downstream consumption of incomplete evidence
    cacheable: true
    idempotency: pinned inputs/configuration/adapter
    review_boundary: candidate evidence
  - stage_id: SCHEMA_MATCHING
    required: false
    capability_required_for_v1: true
    conditional: true
    dependencies: [SOURCE_SNAPSHOT_STAGE, PROFILING]
    optional_dependencies: [DEPENDENCY_DISCOVERY]
    input_artifact_types: [SourceCatalogs, SourceSnapshotResults, BatchReference, ColumnProfile, TableProfile, SchemaMatchRequest]
    optional_input_artifact_types: [DependencyEvidence, "MatchingAuthorization when INSTANCE_AWARE"]
    output_artifact_types: [SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, SchemaMatchFailure, SchemaMatchCapability, SchemaMatchPruningSummary, SchemaMatchArtifactReference]
    failure_consequence: FAILED when selected; SKIPPED only when no cross-source mapping scope is selected and policy records the reason
    cacheable: true
    idempotency: pinned inputs/configuration/adapter
    review_boundary: candidate mapping
    skip_semantics: SKIPPED only for a single-source/no-cross-source plan; multi-source V1 plans require this capability
  - stage_id: QUALITY_ANALYSIS
    required: true
    dependencies: [SOURCE_SNAPSHOT_STAGE, PROFILING]
    optional_dependencies: []
    input_artifact_types: [SourceCatalog, SourceSnapshot, SourceSnapshotResult, BatchReference, SourceRecordReference, ColumnProfile, TableProfile, ValuePatternSummary, DependencyEvidence, QualityRule]
    optional_input_artifact_types: [DependencyEvidence]
    output_artifact_types: [QualityIssue, RepairProposal, RepairValidationPlan, QualityResult]
    failure_consequence: NEEDS_REVIEW or FAILED
    cacheable: true
    idempotency: pinned inputs/configuration
    review_boundary: repair/quarantine proposal
  - stage_id: OPTIONAL_SEMANTIC_EVIDENCE
    required: false
    conditional: true
    capability_required_for_v1: false
    dependencies: [SOURCE_SNAPSHOT_STAGE, PROFILING]
    optional_dependencies: []
    input_artifact_types: [SemanticEvidenceRequest]
    output_artifact_types: [LLMEvidence]
    failure_consequence: SKIPPED if optional; BLOCKED if required and unavailable
    cacheable: true
    idempotency: pinned prompt/configuration/provider
    review_boundary: semantic hypothesis
  - stage_id: LEARNED_EVIDENCE
    required: false
    conditional: true
    capability_required_for_v1: false
    dependencies: [SOURCE_SNAPSHOT_STAGE, PROFILING, DEPENDENCY_DISCOVERY]
    optional_dependencies: [SCHEMA_MATCHING, QUALITY_ANALYSIS]
    input_artifact_types: [RelationshipCandidate, InclusionDependencyEvidence, SchemaMatchCandidate, SchemaMatchScore, SchemaMatchSignal, ColumnProfile, QualityResult]
    optional_training_inputs: [MLTrainingLabel, benchmark dataset configuration]
    output_artifact_types: [MLFeatureVector, MLBaselineEvaluation, MLModelEvidence, LearnedRankingEvidence, MLFeatureContribution, MLRankStabilityObservation, ActiveLearningSuggestion, MLCalibrationExperiment]
    failure_consequence: SKIPPED or explicit UNAVAILABLE/INSUFFICIENT_DATA/FAILED; deterministic baseline is retained
    cacheable: true
    idempotency: pinned feature schema/dataset/split/model configuration
    review_boundary: candidate ranking evidence and label-query suggestions
    skip_semantics: SKIPPED when no explicit benchmark labels or optional capability is configured; no acceptance decision is emitted
  - stage_id: EVIDENCE_FUSION
    required: true
    dependencies: [PROFILING, DEPENDENCY_DISCOVERY, QUALITY_ANALYSIS]
    optional_dependencies: [SCHEMA_MATCHING, OPTIONAL_SEMANTIC_EVIDENCE, LEARNED_EVIDENCE]
    input_artifact_types: ["ProfileResult[]", "QualityResult[]", "DependencyResult[]", "SchemaMatchResult[] when cross_source_mapping_scope", DeclaredConstraint, SourceCatalog, DomainAssertion, "LLMEvidence[]", "AppliedMLResult[]", FusionSubjectBinding, ProducerEvidenceStatus]
    output_artifact_types: [EvidenceFusionResult, RelationshipDecision, SemanticMappingDecision, RepairProposal, Conflict]
    failure_consequence: FAILED; conflicts remain REVIEW_REQUIRED
    cacheable: true
    idempotency: pinned evidence/policy
    review_boundary: evidence candidates and conflicts prepared for policy review
    conditional_dependencies:
      - dependency: SCHEMA_MATCHING
        when: cross_source_mapping_scope == true
        requires: complete SchemaMatchCandidate artifact
        otherwise: matching may be absent or policy-recorded SKIPPED
  - stage_id: REVIEW_EVIDENCE_DECISIONS
    required: true
    conditional: true
    capability_required_for_v1: false
    dependencies: [EVIDENCE_FUSION]
    optional_dependencies: []
    input_artifact_types: [RelationshipDecision, SemanticMappingDecision, RepairProposal, Conflict]
    output_artifact_types: [ReviewDecision]
    failure_consequence: NEEDS_REVIEW
    cacheable: false
    idempotency: subject artifact identity and compatibility fingerprint
    review_boundary: evidence, mapping, conflict and repair review
    review_checkpoint_id: REVIEW_EVIDENCE_DECISIONS
    skip_semantics: SKIPPED only when versioned policy says manual evidence review is not required and its automation criteria are satisfied; no invented numeric threshold
  - stage_id: CANONICAL_HYPOTHESES
    required: true
    dependencies: [EVIDENCE_FUSION, REVIEW_EVIDENCE_DECISIONS]
    optional_dependencies: []
    input_artifact_types: [ReviewDecision, DomainAssertion]
    output_artifact_types: [CanonicalModelHypothesis, EntityResolutionSpec]
    failure_consequence: NEEDS_REVIEW
    cacheable: true
    idempotency: pinned decisions/policy
    review_boundary: entity and identity hypothesis
    required_review_checkpoint: REVIEW_EVIDENCE_DECISIONS
  - stage_id: ENTITY_RESOLUTION
    required: false
    conditional: true
    capability_required_for_v1: false
    dependencies: [CANONICAL_HYPOTHESES]
    optional_dependencies: []
    input_artifact_types: [EntityResolutionSpec, SourceCatalog, SourceSnapshotResult, BatchReference, SourceRecordReference, IdentityFieldSpecification, EntityResolutionAuthorization, EvidenceReferences]
    output_artifact_types: [EntityMatchEdge, EntityCluster]
    failure_consequence: affected family FAILED or NEEDS_REVIEW
    cacheable: true
    idempotency: pinned spec/input/adapter
    review_boundary: linkage evidence generation; review is a downstream checkpoint
    skip_semantics: SKIPPED when policy does not require entity resolution; no fake identity links are produced
  - stage_id: REVIEW_CANONICAL_IDENTITY
    required: true
    conditional: true
    capability_required_for_v1: false
    dependencies: [CANONICAL_HYPOTHESES]
    optional_dependencies: [ENTITY_RESOLUTION]
    input_artifact_types: [CanonicalModelHypothesis, EntityMatchEdge, EntityCluster, Conflict]
    output_artifact_types: [ReviewDecision]
    failure_consequence: NEEDS_REVIEW
    cacheable: false
    idempotency: subject artifact identity and compatibility fingerprint
    review_boundary: canonical identity, linkage, survivorship and conflict review
    review_checkpoint_id: REVIEW_CANONICAL_IDENTITY
    conditional_dependencies:
      - dependency: ENTITY_RESOLUTION
        scope: entity_family
        when: entity_resolution_required(entity_family) == true
        requires: ENTITY_RESOLUTION output exists before this checkpoint and linkage review decision is bound to that output
        on_failure: family_scoped NEEDS_REVIEW; no finalization for that family
      - dependency: ENTITY_RESOLUTION
        scope: entity_family
        when: entity_resolution_required(entity_family) == false
        requires: canonical hypothesis exists; ER may be absent or policy-recorded SKIPPED
        on_success: checkpoint may be SKIPPED or completed according to policy
    skip_semantics: SKIPPED only when policy says identity review is not required for the unambiguous family; no unnecessary universal manual review
  - stage_id: CANONICAL_FINALIZATION
    required: true
    dependencies: [CANONICAL_HYPOTHESES, REVIEW_CANONICAL_IDENTITY]
    optional_dependencies: [ENTITY_RESOLUTION]
    input_artifact_types: [CanonicalModelHypothesis, EntityMatchEdge, EntityCluster, ReviewDecision]
    output_artifact_types: [CanonicalModel, SourceRecordCanonicalMap, CanonicalAttribute]
    failure_consequence: NEEDS_REVIEW
    cacheable: true
    idempotency: pinned identity decisions/policy
    review_boundary: canonical survivor and conflict state
    required_review_checkpoint: REVIEW_CANONICAL_IDENTITY
    conditional_dependencies:
      - dependency: ENTITY_RESOLUTION
        scope: entity_family
        when: entity_resolution_required(entity_family) == true
        requires: [ENTITY_RESOLUTION stage SUCCEEDED, COMPLETE linkage artifact, REVIEW_CANONICAL_IDENTITY stage SUCCEEDED, ACCEPTED or REVIEW_ACCEPTABLE linkage decision bound to the ER artifact]
        on_failure: family_scoped BLOCKED or NEEDS_REVIEW; CANONICAL_FINALIZATION cannot publish a mapping for that family
      - dependency: ENTITY_RESOLUTION
        scope: entity_family
        when: entity_resolution_required(entity_family) == false
        requires: REVIEW_CANONICAL_IDENTITY is accepted or policy-recorded SKIPPED; ER may be absent or SKIPPED with reason/policy
        on_success: CANONICAL_FINALIZATION may proceed for that family if all other guards hold
  - stage_id: ANALYTICAL_PLANNING
    required: true
    dependencies: [CANONICAL_FINALIZATION]
    optional_dependencies: []
    input_artifact_types: [CanonicalModel, RelationshipDecision, DomainAssertion]
    output_artifact_types: [AnalyticalPlan, FactSpec, DimensionSpec, GrainSpec, MeasureSpec]
    failure_consequence: NEEDS_REVIEW
    cacheable: true
    idempotency: pinned plan/policy
    review_boundary: analytical plan construction; review is a downstream checkpoint
  - stage_id: REVIEW_ANALYTICAL_PLAN
    required: true
    conditional: true
    capability_required_for_v1: false
    dependencies: [ANALYTICAL_PLANNING]
    optional_dependencies: []
    input_artifact_types: [AnalyticalPlan, FactSpec, DimensionSpec, GrainSpec, MeasureSpec]
    output_artifact_types: [ReviewDecision]
    failure_consequence: NEEDS_REVIEW
    cacheable: false
    idempotency: subject plan identity and compatibility fingerprint
    review_boundary: fact/dimension interpretation, grain, measures and aggregation semantics
    review_checkpoint_id: REVIEW_ANALYTICAL_PLAN
    skip_semantics: SKIPPED only when versioned policy records that analytical-plan review is not required; no arbitrary confidence threshold
  - stage_id: COMPILATION
    required: true
    dependencies: [ANALYTICAL_PLANNING, REVIEW_ANALYTICAL_PLAN]
    optional_dependencies: []
    input_artifact_types: [AnalyticalPlan, ReviewDecision]
    output_artifact_types: [CompiledPlan, GeneratedSQL]
    failure_consequence: FAILED
    cacheable: true
    idempotency: plan/configuration/compiler version
    review_boundary: compile approved analytical plan; materialization review is a downstream checkpoint
    required_review_checkpoint: REVIEW_ANALYTICAL_PLAN
  - stage_id: REVIEW_MATERIALIZATION_PLAN
    required: true
    conditional: true
    capability_required_for_v1: false
    dependencies: [COMPILATION]
    optional_dependencies: []
    input_artifact_types: [CompiledPlan, GeneratedSQL]
    output_artifact_types: [ReviewDecision]
    failure_consequence: NEEDS_REVIEW
    cacheable: false
    idempotency: compiled artifact identity and compatibility fingerprint
    review_boundary: compiled plan, generated SQL and controlled target approval
    review_checkpoint_id: REVIEW_MATERIALIZATION_PLAN
    skip_semantics: SKIPPED only when versioned policy says manual materialization approval is not required; source-write authority is never granted
  - stage_id: MATERIALIZATION
    required: true
    dependencies: [COMPILATION, REVIEW_MATERIALIZATION_PLAN]
    optional_dependencies: []
    input_artifact_types: [CompiledPlan]
    output_artifact_types: [MaterializationArtifact]
    failure_consequence: FAILED
    cacheable: false
    idempotency: attempt-scoped target publication
    review_boundary: controlled target write after policy-conditional materialization approval
    required_review_checkpoint: REVIEW_MATERIALIZATION_PLAN
  - stage_id: VALIDATION_RECONCILIATION
    required: true
    dependencies: [MATERIALIZATION, ANALYTICAL_PLANNING, CANONICAL_FINALIZATION]
    optional_dependencies: []
    input_artifact_types: [MaterializationArtifact, AnalyticalPlan, RecordAccounting, Lineage]
    output_artifact_types: [ValidationReport, ReconciliationResult]
    failure_consequence: run FAILED; target not accepted
    cacheable: true
    idempotency: pinned target/hash/validation policy
    review_boundary: final acceptance
