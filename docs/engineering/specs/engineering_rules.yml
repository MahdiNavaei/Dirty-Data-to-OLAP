schema_version: "1.0"
scope: "implementation rules enforced from Step 06 onward"
provenance:
  authority: "shared invariants, product/domain/data/solution architecture contracts, Step 05 technical-lead audit"
  status: "frozen governance; no product implementation in Step 05"

rules:
  - {rule_id: ENG-001, category: namespace, statement: "All runtime imports use the dirty_data_to_olap namespace.", enforcement_ref: ENF-001, test_type: architecture, owner: "Step06", active_when: "implementation", gate_impact: G2}
  - {rule_id: ENG-002, category: layering, statement: "Domain contracts do not import adapters, persistence, entrypoints or vendor types.", enforcement_ref: ENF-002, test_type: architecture, owner: "Step06", active_when: "implementation", gate_impact: G2}
  - {rule_id: ENG-003, category: contracts, statement: "Cross-component exchange uses project-owned versioned contracts.", enforcement_ref: ENF-003, test_type: contract, owner: "Step06", active_when: "implementation", gate_impact: G2}
  - {rule_id: ENG-004, category: adapters, statement: "Open-source engines are reachable only through project-owned adapter ports.", enforcement_ref: ENF-004, test_type: adapter_contract, owner: "Step12", active_when: "implementation", gate_impact: G4}
  - {rule_id: ENG-005, category: source_safety, statement: "Operational sources are read-only; all transformations target controlled analytical storage.", enforcement_ref: ENF-005, test_type: security, owner: "Step11", active_when: "implementation", gate_impact: G3}
  - {rule_id: ENG-006, category: persistence, statement: "ControlStore stores metadata, decisions and lifecycle state, never raw source rows.", enforcement_ref: ENF-006, test_type: architecture, owner: "Step06", active_when: "implementation", gate_impact: G2}
  - {rule_id: ENG-007, category: provenance, statement: "Every evidence, decision and transformed output retains run, source snapshot, policy and content identity.", enforcement_ref: ENF-007, test_type: contract, owner: "Step17", active_when: "implementation", gate_impact: G5}
  - {rule_id: ENG-008, category: determinism, statement: "Configuration, model/adapter versions and seeds are pinned in the run manifest.", enforcement_ref: ENF-008, test_type: integration, owner: "Step23", active_when: "implementation", gate_impact: G8}
  - {rule_id: ENG-009, category: serialization, statement: "Stable identifiers and canonical serialization make equivalent artifacts comparable.", enforcement_ref: ENF-009, test_type: contract, owner: "Step06", active_when: "implementation", gate_impact: G2}
  - {rule_id: ENG-010, category: review, statement: "Review decisions bind to exact subject identity, content hash and compatibility context.", enforcement_ref: ENF-010, test_type: integration, owner: "Step27", active_when: "implementation", gate_impact: G7}
  - {rule_id: ENG-011, category: review, statement: "Unresolved or rejected review guards cannot be bypassed by confidence scores.", enforcement_ref: ENF-011, test_type: failure_recovery, owner: "Step27", active_when: "implementation", gate_impact: G7}
  - {rule_id: ENG-012, category: entity_resolution, statement: "ER emits EntityMatchEdge and EntityCluster only; canonical mappings are finalized downstream.", enforcement_ref: ENF-012, test_type: architecture, owner: "Step14", active_when: "implementation", gate_impact: G5}
  - {rule_id: ENG-013, category: accounting, statement: "Each transformation boundary accounts for every input record with one terminal disposition and explicit provenance.", enforcement_ref: ENF-013, test_type: data, owner: "Step22", active_when: "implementation", gate_impact: G6}
  - {rule_id: ENG-014, category: modeling, statement: "Fact implementation is blocked until GrainSpec is explicit and validated.", enforcement_ref: ENF-014, test_type: contract, owner: "Step20", active_when: "implementation", gate_impact: G6}
  - {rule_id: ENG-015, category: modeling, statement: "Canonical graph and analytical star schema remain separate artifacts.", enforcement_ref: ENF-015, test_type: architecture, owner: "Step20", active_when: "implementation", gate_impact: G6}
  - {rule_id: ENG-016, category: quality, statement: "Observation, issue, proposal, decision and execution are distinct states.", enforcement_ref: ENF-016, test_type: contract, owner: "Step09", active_when: "implementation", gate_impact: G3}
  - {rule_id: ENG-017, category: intelligence, statement: "LLM or semantic assistance is optional, bounded, attributable and never silently authoritative.", enforcement_ref: ENF-017, test_type: security, owner: "Step16", active_when: "implementation", gate_impact: G4}
  - {rule_id: ENG-018, category: dependency, statement: "Research clones are never runtime imports and may be deleted without changing project contracts.", enforcement_ref: ENF-018, test_type: architecture, owner: "Step12", active_when: "implementation", gate_impact: G4}
  - {rule_id: ENG-019, category: memory, statement: "Profiling and extraction use bounded sampling/chunking and do not require enterprise tables in Python memory.", enforcement_ref: ENF-019, test_type: performance, owner: "Step37", active_when: "implementation", gate_impact: G12}
  - {rule_id: ENG-020, category: claims, statement: "A passing static check or synthetic fixture is not represented as production, live-provider or physical acceptance evidence.", enforcement_ref: ENF-020, test_type: release, owner: "Step41", active_when: "always", gate_impact: G15}
  - {rule_id: ENG-021, category: security, statement: "Secrets, credentials, raw PII and operational source contents are absent from logs and committed artifacts.", enforcement_ref: ENF-021, test_type: security, owner: "Step33", active_when: "implementation", gate_impact: G10}
  - {rule_id: ENG-022, category: sequence, statement: "Step 05 freezes plans and governance; Step 06 is the first product implementation step.", enforcement_ref: ENF-022, test_type: architecture, owner: "Step05", active_when: "always", gate_impact: G2}
  - {rule_id: ENG-023, category: failure, statement: "Failures preserve prior successful artifacts and produce explicit FAILED, BLOCKED or NEEDS_REVIEW state.", enforcement_ref: ENF-023, test_type: failure_recovery, owner: "Step28", active_when: "implementation", gate_impact: G8}
  - {rule_id: ENG-024, category: dependencies, statement: "New dependencies require license, security, compatibility, version-pinning and adapter-boundary review.", enforcement_ref: ENF-024, test_type: architecture, owner: "Step12", active_when: "implementation", gate_impact: G4}
  - {rule_id: ENG-025, category: reviewability, statement: "Every material implementation change includes focused tests, evidence and a handoff note.", enforcement_ref: ENF-025, test_type: release, owner: "Step40", active_when: "implementation", gate_impact: G14}
