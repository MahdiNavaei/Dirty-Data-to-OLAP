work_packages:
  - {package_id: WP01, steps: [1, 2, 3, 4, 5], objective: "Freeze product, domain, data, software and engineering contracts", entry: "G0/G1 PASS", exit: "G2 PASS and no implementation", gate: G2}
  - {package_id: WP02, steps: [6], objective: "Establish the database-access and introspection foundation with only the minimum package/test scaffold", entry: "G2 PASS", exit: "tested read-only database access/introspection substrate handed to Step07", gate: G2}
  - {package_id: WP03, steps: [7, 8, 9, 10, 11], objective: "Implement source, snapshot, profiling, quality and safety foundations", entry: "WP02 contracts", exit: "read-only adapters, bounded profiling and privacy/security evidence", gate: G3}
  - {package_id: WP04, steps: [12, 13, 14, 15, 16, 17], objective: "Implement evidence producers, replaceable adapters, bounded semantic assistance and fusion", entry: "G3 PASS", exit: "normalized evidence and conflict-preserving decisions", gate: G4}
  - {package_id: WP05, steps: [18], objective: "Evaluate evidence, schema matching and entity resolution without overstating scores", entry: "WP04 outputs", exit: "calibration/evaluation report and failure fixtures", gate: G5}
  - {package_id: WP06, steps: [19, 20, 21], objective: "Finalize canonical model and produce reviewed analytical plans, grains and measures", entry: "G5 PASS", exit: "canonical and OLAP contracts with no unresolved required grain", gate: G6}
  - {package_id: WP07, steps: [22], objective: "Validate accounting, lineage, grain, keys and reconciliation", entry: "WP06 artifacts", exit: "data QA acceptance evidence", gate: G6}
  - {package_id: WP08, steps: [23, 24], objective: "Harden platform persistence, capabilities, execution and scale boundaries", entry: "G6 PASS", exit: "operational platform contract", gate: G8}
  - {package_id: WP09, steps: [25, 26, 27, 28, 29], objective: "Build reviewable product surfaces and durable orchestration", entry: "platform contracts", exit: "review flow and API/UI acceptance", gate: G7}
  - {package_id: WP10, steps: [30, 31, 32, 33], objective: "Package, test, compatibility-check and secure the application", entry: "product surface", exit: "delivery, QA, compatibility and AppSec evidence", gate: G10}
  - {package_id: WP11, steps: [34, 35, 36], objective: "Add telemetry, reliability controls and fault-injection evidence", entry: "runtime package", exit: "resilience report and recovery evidence", gate: G11}
  - {package_id: WP12, steps: [37, 38, 39], objective: "Measure performance/load and run authorized adversarial review", entry: "correctness gates", exit: "performance and red-team evidence", gate: G13}
  - {package_id: WP13, steps: [40, 41], objective: "Make the repository usable and publish final bounded claims", entry: "all technical gates", exit: "fresh-clone evidence, final docs and release manifest", gate: G15}

first_implementation_slice:
  step: 6
  allowed_paths: [src/dirty_data_to_olap/adapters/sources/sql/, src/dirty_data_to_olap/domain/, tests/unit/, tests/contract/, tests/integration/, pyproject.toml]
  required_outputs:
    - "minimum namespace and test scaffold required by the Step06 slice"
    - "read-only database connection substrate and external connection-profile reference contract"
    - "normalized database capability description and normalized database failure representation"
    - "safe metadata introspection boundary with identifier/schema qualification rules"
    - "transaction/isolation, timeout, pooling, cleanup and bounded sampling semantics"
    - "SQLite local integration fixture where useful"
  handoff_to_step_7: ["tested database access/introspection foundations", "read-only policy", "safe sampling/query policy", "normalized DB errors", "Step07 SourceAdapter boundary inputs"]
  tests_required: ["read-only negative", "metadata introspection", "timeout", "connection failure normalization", "identifier/schema edge cases", "bounded sampling", "architecture/import boundary"]
  forbidden_outputs: ["business-stage implementation", "OSS clone", "benchmark generator", "source write path", "production workflow", "dlt integration", "complete SourceAdapter ingestion", "canonical/ER/OLAP semantics"]
  non_ownership: ["business semantics", "entity resolution", "canonical semantics", "OLAP semantics", "all future domain contract families", "dlt/full SourceAdapter implementation"]
