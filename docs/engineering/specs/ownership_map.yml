schema_version: "1.0"
scope: "v1 implementation ownership for the frozen software architecture"
provenance:
  authority: "05_MASTER_BUILD_SEQUENCE.md, architecture/specs/components.yml, architecture/specs/engine_interfaces.yml"
  status: "Step 05 planning artifact; implementation ownership is future-facing"

implementation_ownership_schema:
  owner_field: primary_specialist
  step_field: implementation_step
  default_implementation_status: PLANNED
  status_meaning: "PLANNED means the named future specialist owns the implementation slice; it does not claim implementation exists."
  governance_owner: "Step05 Technical Lead / Engineering Lead"

contract_family_owners:
  source_and_database: "Step06 Database Engineer / DBA bootstrap; Step07 Senior Data Engineer runtime source implementation"
  profiling: "Step08 Data Profiling Specialist"
  quality: "Step09 Data Quality Engineer"
  dependency_evidence: "Step12 Dependency Discovery Engineer"
  schema_matching: "Step13 Schema Matching Engineer"
  entity_resolution: "Step14 Entity Resolution Engineer"
  semantic_evidence: "Step16 LLM / Semantic AI Engineer"
  evidence_fusion_and_decisions: "Step17 Evidence Fusion Engineer"
  canonical: "Step19 Canonical Model Engineer"
  analytical_and_olap: "Step20 OLAP Engineer"
  validation_and_reconciliation: "Step22 Data QA Engineer"

components:
  - {component_id: domain.contracts, primary_specialist: "Step06 Database Engineer / DBA", implementation_step: 6, implementation_scope: bootstrap-only, test_strategy: "contract and architecture tests"}
  - {component_id: application.run_manager, primary_specialist: "Step27 Backend Engineer", implementation_step: 27, test_strategy: "unit, lifecycle integration, failure recovery"}
  - {component_id: application.stage_orchestrator, primary_specialist: "Step28 Distributed Systems / Jobs Engineer", implementation_step: 28, test_strategy: "DAG contract, lifecycle, resume and cancellation"}
  - {component_id: application.review_policy, primary_specialist: "Step27 Backend Engineer", implementation_step: 27, test_strategy: "review contract and invalidation integration"}
  - {component_id: application.source_registry, primary_specialist: "Step07 Senior Data Engineer", implementation_step: 7, test_strategy: "source contract and security negative tests"}
  - {component_id: application.source_snapshot, primary_specialist: "Step07 Senior Data Engineer", implementation_step: 7, test_strategy: "adapter contract and bounded-read tests"}
  - {component_id: application.discovery, primary_specialist: "Step07 Senior Data Engineer", implementation_step: 7, test_strategy: "source discovery contract tests"}
  - {component_id: application.profiling, primary_specialist: "Step08 Data Profiling Specialist", implementation_step: 8, test_strategy: "profiling fixtures and scope tests"}
  - {component_id: application.dependency_discovery, primary_specialist: "Step12 Dependency Discovery Engineer", implementation_step: 12, test_strategy: "key, FD, IND and trap evaluation"}
  - {component_id: application.schema_matching, primary_specialist: "Step13 Schema Matching Engineer", implementation_step: 13, test_strategy: "labeled matching evaluation"}
  - {component_id: application.quality, primary_specialist: "Step09 Data Quality Engineer", implementation_step: 9, test_strategy: "quality taxonomy fixtures and negatives"}
  - {component_id: application.semantic_evidence, primary_specialist: "Step16 LLM / Semantic AI Engineer", implementation_step: 16, test_strategy: "bounded optional-provider contract"}
  - {component_id: application.evidence_fusion, primary_specialist: "Step17 Evidence Fusion Engineer", implementation_step: 17, test_strategy: "evidence, conflict and decision evaluation"}
  - {component_id: application.canonical_hypotheses, primary_specialist: "Step19 Canonical Model Engineer", implementation_step: 19, test_strategy: "canonical contract and lineage tests"}
  - {component_id: application.entity_resolution, primary_specialist: "Step14 Entity Resolution Engineer", implementation_step: 14, test_strategy: "ER adapter and false-merge evaluation"}
  - {component_id: application.canonical_finalization, primary_specialist: "Step19 Canonical Model Engineer", implementation_step: 19, test_strategy: "identity, survivorship and accounting tests"}
  - {component_id: application.analytical_planner, primary_specialist: "Step20 OLAP Engineer", implementation_step: 20, test_strategy: "grain, measure and model contract tests"}
  - {component_id: application.compiler, primary_specialist: "Step20 OLAP Engineer", implementation_step: 20, test_strategy: "compiled-plan and SQL contract tests"}
  - {component_id: application.materializer, primary_specialist: "Step20 OLAP Engineer", implementation_step: 20, test_strategy: "controlled-target integration tests"}
  - {component_id: application.validation, primary_specialist: "Step22 Data QA Engineer", implementation_step: 22, test_strategy: "reconciliation and release acceptance suite"}
  - {component_id: adapters.source, primary_specialist: "Step07 Senior Data Engineer", implementation_step: 7, test_strategy: "source adapter contract tests"}
  - {component_id: adapters.profiling, primary_specialist: "Step08 Data Profiling Specialist", implementation_step: 8, test_strategy: "DataProfiler adapter contract tests"}
  - {component_id: adapters.dependencies, primary_specialist: "Step12 Dependency Discovery Engineer", implementation_step: 12, test_strategy: "Desbordante adapter contract tests"}
  - {component_id: adapters.matching, primary_specialist: "Step13 Schema Matching Engineer", implementation_step: 13, test_strategy: "Valentine adapter contract tests"}
  - {component_id: adapters.entity_resolution, primary_specialist: "Step14 Entity Resolution Engineer", implementation_step: 14, test_strategy: "Splink normalized-output contract tests"}
  - {component_id: adapters.semantic, primary_specialist: "Step16 LLM / Semantic AI Engineer", implementation_step: 16, test_strategy: "provider provenance and unavailable-path tests"}
