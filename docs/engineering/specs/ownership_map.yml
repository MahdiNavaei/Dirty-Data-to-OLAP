  - {component_id: runtime.stage_executor, primary_specialist: "Step28 Distributed Systems / Jobs Engineer", implementation_step: 28, test_strategy: "attempt isolation and retry tests"}
  - {component_id: runtime.capability_registry, primary_specialist: "Step23 Data Platform Engineer", implementation_step: 23, test_strategy: "capability policy and version tests"}
  - {component_id: entrypoints.cli, primary_specialist: "Step27 Backend Engineer", implementation_step: 27, test_strategy: "CLI contract and smoke tests"}
  - {component_id: entrypoints.api, primary_specialist: "Step27 Backend Engineer", implementation_step: 27, test_strategy: "API contract and authorization tests"}
  - {component_id: composition.root, primary_specialist: "Step06 Database Engineer / DBA", implementation_step: 6, implementation_scope: bootstrap-only, ongoing_owners: "Step23 Data Platform / Step27 Backend / Step28 Distributed Systems according to wired concern", test_strategy: "composition and import-boundary tests"}

interfaces:
  - {interface_id: SourceAdapter, owner_component: adapters.source, implementation_step: 7, test_strategy: "adapter contract and read-only negative tests"}
  - {interface_id: ProfilingAdapter, owner_component: adapters.profiling, implementation_step: 8, test_strategy: "adapter contract tests"}
  - {interface_id: DependencyDiscoveryAdapter, owner_component: adapters.dependencies, implementation_step: 12, test_strategy: "adapter contract tests"}
  - {interface_id: SchemaMatchingAdapter, owner_component: adapters.matching, implementation_step: 13, test_strategy: "adapter contract tests"}
  - {interface_id: EntityResolutionAdapter, owner_component: adapters.entity_resolution, implementation_step: 14, test_strategy: "normalized output and provenance tests"}
  - {interface_id: OptionalSemanticEvidenceAdapter, owner_component: adapters.semantic, implementation_step: 16, test_strategy: "optional and failure-path tests"}
  - {interface_id: MaterializerPort, owner_component: adapters.materialization, implementation_step: 20, test_strategy: "controlled target contract tests"}
  - {interface_id: ControlStorePort, owner_component: persistence.control_store, implementation_step: 6, test_strategy: "persistence contract tests"}
  - {interface_id: ArtifactStorePort, owner_component: persistence.artifact_store, implementation_step: 23, test_strategy: "artifact immutability tests"}
  - {interface_id: StageExecutorPort, owner_component: runtime.stage_executor, implementation_step: 28, test_strategy: "execution lifecycle tests"}
  - {interface_id: CapabilityRegistryPort, owner_component: runtime.capability_registry, implementation_step: 23, test_strategy: "capability registry contract tests"}

