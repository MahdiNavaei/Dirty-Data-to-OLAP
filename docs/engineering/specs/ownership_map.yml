  - {stage_id: SOURCE_SNAPSHOT_STAGE, owner_component: application.source_snapshot, implementation_step: 7, test_strategy: "bounded-read and immutability"}
  - {stage_id: PROFILING, owner_component: application.profiling, implementation_step: 8, test_strategy: "scope-aware profiling"}
  - {stage_id: DEPENDENCY_DISCOVERY, owner_component: application.dependency_discovery, implementation_step: 12, test_strategy: "key/FD/IND evaluation"}
  - {stage_id: SCHEMA_MATCHING, owner_component: application.schema_matching, implementation_step: 13, test_strategy: "labeled matching evaluation"}
  - {stage_id: QUALITY_ANALYSIS, owner_component: application.quality, implementation_step: 9, test_strategy: "quality fixture and negative"}
  - {stage_id: OPTIONAL_SEMANTIC_EVIDENCE, owner_component: application.semantic_evidence, implementation_step: 16, test_strategy: "optional-provider failure path"}
  - {stage_id: EVIDENCE_FUSION, owner_component: application.evidence_fusion, implementation_step: 17, test_strategy: "conflict-preserving evaluation"}
  - {stage_id: REVIEW_EVIDENCE_DECISIONS, owner_component: application.review_policy, implementation_step: 27, test_strategy: "review guard and invalidation"}
  - {stage_id: CANONICAL_HYPOTHESES, owner_component: application.canonical_hypotheses, implementation_step: 19, test_strategy: "canonical contract"}
  - {stage_id: ENTITY_RESOLUTION, owner_component: application.entity_resolution, implementation_step: 14, test_strategy: "false-merge evaluation"}
  - {stage_id: REVIEW_CANONICAL_IDENTITY, owner_component: application.review_policy, implementation_step: 27, test_strategy: "identity review guard"}
  - {stage_id: CANONICAL_FINALIZATION, owner_component: application.canonical_finalization, implementation_step: 19, test_strategy: "mapping and survivorship"}
  - {stage_id: ANALYTICAL_PLANNING, owner_component: application.analytical_planner, implementation_step: 20, test_strategy: "grain and measures"}
  - {stage_id: REVIEW_ANALYTICAL_PLAN, owner_component: application.review_policy, implementation_step: 27, test_strategy: "analytical review guard"}
  - {stage_id: COMPILATION, owner_component: application.compiler, implementation_step: 20, test_strategy: "compiled-plan contract"}
  - {stage_id: REVIEW_MATERIALIZATION_PLAN, owner_component: application.review_policy, implementation_step: 27, test_strategy: "materialization review guard"}
  - {stage_id: MATERIALIZATION, owner_component: application.materializer, implementation_step: 20, test_strategy: "DuckDB integration"}
  - {stage_id: VALIDATION_RECONCILIATION, owner_component: application.validation, implementation_step: 22, test_strategy: "reconciliation acceptance"}

handoff:
  first_implementation_step: 6
  first_implementation_role: "Database Engineer / DBA"
  required_inputs: ["G0 PASS", "G1 PASS", "G2 PASS", "all Step 05 engineering artifacts"]
  substantive_scope: ["database connection behavior", "safe metadata introspection", "transactions/isolation", "timeouts", "pooling", "query cost", "safe sampling", "large-table behavior", "database-specific metadata quirks"]
  handoff_to_step_7: ["tested database access/introspection foundations", "read-only policy", "safe sampling/query policy", "normalized DB failures", "SourceAdapter boundary inputs"]
  non_ownership: ["business semantics", "destructive cleaning", "entity resolution", "canonical semantics", "OLAP semantics", "all future domain contract families", "dlt integration", "complete SourceAdapter ingestion"]
  forbidden_before_step_6: ["production source implementation", "third-party runtime dependency installation", "research clone", "benchmark generator", "CI workflow"]
