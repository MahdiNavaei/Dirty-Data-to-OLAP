schema_version: "1.0"
scope: "G0-G15 specialist release and implementation gates"
provenance:
  authority: "05_MASTER_BUILD_SEQUENCE.md and MASTER_EXECUTION_STATE.yml"
  status: "G2 becomes PASS only after pre-gate validation"

gates:
  - {gate_id: G0, name: Product Contract, after_step: 1, owner_step: 1, status: PASS, semantic_purpose: "V1 scope and OLAP-ready output are unambiguous", required_evidence: [product_contract, acceptance_criteria, scope_boundary], blocks: [implementation]}
  - {gate_id: G1, name: Domain Truth, after_step: 2, owner_step: 2, status: PASS, semantic_purpose: "critical business terms and ambiguities are explicit", required_evidence: [domain_docs, benchmark_labels, domain_validator], blocks: [architecture]}
  - {gate_id: G2, name: Architecture Ready, after_step: 5, owner_step: 5, status: PASS, semantic_purpose: "product, domain, data, software and engineering plans are PASS", required_evidence: [engineering_plan, ownership_map, test_strategy, enforcement, readiness_audit, post_gate_validator], blocks: [implementation]}
  - {gate_id: G3, name: Source Safety, after_step: 11, owner_step: 11, status: PENDING, semantic_purpose: "safe ingestion, privacy and read-only controls", required_evidence: [safe_ingestion, privacy_controls, read_only_source_tests, db_security_review], blocks: [downstream_data_execution]}
  - {gate_id: G4, name: Bounded Intelligence, after_step: 16, owner_step: 16, status: PENDING, semantic_purpose: "independent evidence producers and bounded ML/LLM semantics; LLM evidence never becomes truth", required_evidence: [independent_evidence_producers, bounded_ml_llm, privacy_failure_isolation, llm_evidence_not_truth], blocks: [evaluation]}
  - {gate_id: G5, name: Inference Validity, after_step: 18, owner_step: 18, status: PENDING, semantic_purpose: "benchmark evaluation, calibration and threshold justification", required_evidence: [benchmark_evaluation, calibration, threshold_justification, score_semantics], blocks: [canonical_acceptance]}
  - {gate_id: G6, name: Data Correctness, after_step: 22, owner_step: 22, status: PENDING, semantic_purpose: "source-to-canonical-to-OLAP correctness and reconciliation", required_evidence: [grain_tests, accounting, lineage, reconciliation], blocks: [release]}
  - {gate_id: G7, name: End-to-End Product, after_step: 29, owner_step: 29, status: PENDING, semantic_purpose: "real user/API/UI/engine path from source to validated output", required_evidence: [user_path, api_path, ui_path, engine_path, review_flow_e2e], blocks: [release]}
  - {gate_id: G8, name: Reproducible Build, after_step: 30, owner_step: 30, status: PENDING, semantic_purpose: "clean environment builds and runs checks without undocumented local state", required_evidence: [clean_build, reproducible_environment, ci, dependency_scan, release_foundation], blocks: [release]}
  - {gate_id: G9, name: Functional Support, after_step: 32, owner_step: 32, status: PENDING, semantic_purpose: "system-level functional verification and tested compatibility claims", required_evidence: [functional_verification, source_compatibility, adapter_matrix, claims_audit], blocks: [release]}
  - {gate_id: G10, name: Application Security, after_step: 33, owner_step: 33, status: PENDING, semantic_purpose: "critical/high application vulnerabilities are remediated or explicitly block release", required_evidence: [security_tests, secret_scan, threat_model, remediation], blocks: [release]}
  - {gate_id: G11, name: Resilience, after_step: 36, owner_step: 36, status: PENDING, semantic_purpose: "failure does not silently become corrupted analytical output", required_evidence: [fault_injection, truthful_state, safe_retry, recoverability, audit_trail], blocks: [release]}
  - {gate_id: G12, name: Capacity, after_step: 38, owner_step: 38, status: PENDING, semantic_purpose: "runtime, memory and load failure boundaries are known", required_evidence: [stage_benchmarks, memory, load_report, overload_recovery], blocks: [release]}
  - {gate_id: G13, name: Adversarial Security, after_step: 39, owner_step: 39, status: PENDING, semantic_purpose: "authorized adversarial findings are remediated or explicitly accepted", required_evidence: [authorized_red_team_report, ssrf_sql_abuse_credential_tests, remediations], blocks: [release]}
  - {gate_id: G14, name: Usability, after_step: 40, owner_step: 40, status: PENDING, semantic_purpose: "supported workflow, configuration, evidence semantics and troubleshooting are usable", required_evidence: [fresh_clone, docs, examples, usability_review], blocks: [release]}
  - {gate_id: G15, name: Release, after_step: 41, owner_step: 41, status: PENDING, semantic_purpose: "final documentation and release claims are bounded by evidence", required_evidence: [final_docs, limitation_audit, release_manifest, unsupported_claims_audit], blocks: [public_release]}

ordering_constraints:
  - "evidence producers precede EVIDENCE_FUSION"
  - "evaluation follows evidence and ER producers"
  - "CANONICAL_FINALIZATION follows evaluation and evidence guards"
  - "OLAP follows canonical finalization"
  - "performance follows correctness"
  - "Red Team follows AppSec"
  - "Technical Writer is final"
